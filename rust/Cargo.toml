[package]
name = "circuitsim"
version = "0.2.0"
edition = "2021"
description = "Circuit autopilot simulator core: point-mass and 6DOF flight models, autopilot, glide planner"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# Browser build: optimise for size (the hot loop is small; speed is still ample)
[profile.wasm]
inherits = "release"
opt-level = "z"
strip = true
